[env:esp32dev]

platform = espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/RTClib@2.1.4
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
