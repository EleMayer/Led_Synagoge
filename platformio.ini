[platformio]
; Standard: nur die Firmware bauen/hochladen. Die Tests laufen gezielt mit
;   pio test -e native   bzw.   pio test -e esp32dev
default_envs = esp32dev

[env:esp32dev]

platform = espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/RTClib@2.1.4
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Unit-Tests der reinen Automatik-Logik auf dem PC (kein ESP32 noetig):
;   pio test -e native
; Testet include/auto_logic.h; die Firmware (src/main.cpp) wird dabei nicht
; mitgebaut (Arduino-abhaengig).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
