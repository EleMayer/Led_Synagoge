<script>
(function()
{
    let state = {
        mode: 3,
        left: 80, right: 80, logo: 80, global: 80,
        autoBrightness: 0,
        rtc: true, ntp: true,
        ip: 'Demo', rssi: -55, wifi: true, ap: false,
        ssid: 'Demo (ohne ESP32)', firmware: 'Demo',
        sched: { tMorning: 6, tDay: 8, tEvening: 18, tNight: 23,
                 bMorning: 90, bDay: 90, bEveStart: 60, bEveEnd: 25 },
        presets: []
    };

    let overrideActive = false;
    let overrideWindow = -1;

    // Begrenzt einen Wert auf den Bereich lo..hi.
    function clamp(value, lo, hi)
    {
        value = parseInt(value);
        if(isNaN(value)) return lo;
        if(value < lo) return lo;
        if(value > hi) return hi;
        return value;
    }

    // Minuten seit Mitternacht (aktuelle Uhrzeit).
    function nowMinutes()
    {
        let d = new Date();
        return d.getHours() * 60 + d.getMinutes();
    }

    // Aktuelles Zeitfenster: 0 = Nacht, 1 = Morgen, 2 = Tag, 3 = Abend.
    function currentWindow()
    {
        let t = nowMinutes();
        let s = state.sched;
        if(t >= s.tNight * 60 || t < s.tMorning * 60) return 0;
        if(t < s.tDay * 60) return 1;
        if(t < s.tEvening * 60) return 2;
        return 3;
    }

    // Automatik-Helligkeit fuer die aktuelle Uhrzeit.
    function autoBrightness()
    {
        let t = nowMinutes();
        let s = state.sched;

        if(t >= s.tNight * 60 || t < s.tMorning * 60) return 0;

        if(t < s.tDay * 60)
        {
            let p = (t - s.tMorning * 60) / (s.tDay * 60 - s.tMorning * 60);
            return Math.round(clamp01(p) * s.bMorning);
        }

        if(t < s.tEvening * 60) return s.bDay;

        let q = (t - s.tEvening * 60) / (s.tNight * 60 - s.tEvening * 60);
        return Math.round(s.bEveStart + (s.bEveEnd - s.bEveStart) * clamp01(q));
    }

    // Begrenzt einen Wert auf 0..1.
    function clamp01(p)
    {
        if(p < 0) return 0;
        if(p > 1) return 1;
        return p;
    }

    // Zweistellige Zahl (z. B. 7 -> "07").
    function two(n)
    {
        return String(n).padStart(2, '0');
    }

    // Baut die Statusmeldung als JSON (wie der echte Controller).
    function buildStatus()
    {
        let d = new Date();
        state.autoBrightness = autoBrightness();
        state.time = two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
        state.date = two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear();
        return JSON.stringify(state);
    }

    // Ein manueller Eingriff waehrend der Automatik schaltet auf Statisch.
    function enterOverride()
    {
        if(state.mode === 3)
        {
            state.mode = 1;
            overrideActive = true;
            overrideWindow = currentWindow();
        }
    }

    // Sucht eine Szene anhand des Namens; null, wenn keine gefunden.
    function findPresetByName(name)
    {
        for(let i = 0; i < state.presets.length; i++)
        {
            if(state.presets[i].name === name) return state.presets[i];
        }
        return null;
    }

    // Verarbeitet einen Befehl der App (wie onWebSocketEvent in der Firmware).
    function handle(msg)
    {
        let doc;
        try { doc = JSON.parse(msg); } catch(e) { return; }

        if(typeof doc.mode === 'number' && doc.mode >= 0 && doc.mode <= 12)
        {
            state.mode = doc.mode;
            if(doc.mode === 3)
            {
                overrideActive = false;
            }
            else
            {
                overrideActive = true;
                overrideWindow = currentWindow();
            }
        }

        if(doc.left !== undefined)  { state.left  = clamp(doc.left, 0, 100);  enterOverride(); }
        if(doc.right !== undefined) { state.right = clamp(doc.right, 0, 100); enterOverride(); }
        if(doc.logo !== undefined)  { state.logo  = clamp(doc.logo, 0, 100);  enterOverride(); }
        if(doc.global !== undefined) state.global = clamp(doc.global, 0, 100);

        // Automatik-Zeitprofil ist fest im Code (config.h) - wird nicht angenommen.

        if(typeof doc.savePreset === 'string' && doc.savePreset)
        {
            let p = findPresetByName(doc.savePreset);
            if(!p && state.presets.length < 6)
            {
                p = { slot: state.presets.length, name: doc.savePreset };
                state.presets.push(p);
            }
            if(p)
            {
                p.left = state.left;
                p.right = state.right;
                p.logo = state.logo;
            }
        }

        if(typeof doc.applyPreset === 'number')
        {
            for(let i = 0; i < state.presets.length; i++)
            {
                if(state.presets[i].slot === doc.applyPreset)
                {
                    let found = state.presets[i];
                    state.left = found.left;
                    state.right = found.right;
                    state.logo = found.logo;
                    state.mode = 1;
                    overrideActive = true;
                    overrideWindow = currentWindow();
                }
            }
        }

        if(typeof doc.deletePreset === 'number')
        {
            let kept = [];
            for(let i = 0; i < state.presets.length; i++)
            {
                if(state.presets[i].slot !== doc.deletePreset) kept.push(state.presets[i]);
            }
            state.presets = kept;
            for(let i = 0; i < state.presets.length; i++)
            {
                state.presets[i].slot = i;
            }
        }
    }

    // Ersatz fuer WebSocket: verbindet sofort und schickt jede Sekunde den Status.
    class FakeWebSocket
    {
        constructor()
        {
            let self = this;
            this.readyState = 0;
            this.timer = null;

            setTimeout(function()
            {
                self.readyState = 1;
                if(self.onopen) self.onopen();
                if(self.onmessage) self.onmessage({ data: buildStatus() });
            }, 50);

            this.timer = setInterval(function()
            {
                if(self.readyState !== 1 || !self.onmessage) return;

                // Automatik-Rueckkehr beim naechsten Zeitfensterwechsel.
                if(overrideActive && state.mode !== 3)
                {
                    let w = currentWindow();
                    if(w >= 0 && overrideWindow >= 0 && w !== overrideWindow)
                    {
                        state.mode = 3;
                        overrideActive = false;
                    }
                }
                self.onmessage({ data: buildStatus() });
            }, 1000);
        }

        send(msg)
        {
            handle(msg);
            if(this.onmessage) this.onmessage({ data: buildStatus() });
        }

        close()
        {
            this.readyState = 3;
            clearInterval(this.timer);
        }
    }

    FakeWebSocket.CONNECTING = 0;
    FakeWebSocket.OPEN = 1;
    FakeWebSocket.CLOSING = 2;
    FakeWebSocket.CLOSED = 3;

    window.WebSocket = FakeWebSocket;
})();
</script>

function applyLanguage()
{
    document.documentElement.setAttribute("lang", lang);

    let nodes = document.querySelectorAll("[data-i18n]");
    for(let i = 0; i < nodes.length; i++)
    {
        nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }

    let placeholders = document.querySelectorAll("[data-i18n-ph]");
    for(let i = 0; i < placeholders.length; i++)
    {
        placeholders[i].setAttribute("placeholder", t(placeholders[i].getAttribute("data-i18n-ph")));
    }

    let modeButtons = document.querySelectorAll(".mode");
    for(let i = 0; i < modeButtons.length; i++)
    {
        let m = parseInt(modeButtons[i].dataset.mode);
        modeButtons[i].textContent = MODE_LABEL[lang][m];
    }

    // Knopf zeigt die jeweils andere Sprache an.
    document.getElementById("langBtn").textContent = (lang === "de") ? "EN" : "DE";

    updateInstallHint();
    renderAutoPhases();

    if(lastData)
    {
        updateUI(lastData);
    }
    else
    {
        renderPresets([]);
    }
}

// Wechselt zwischen Deutsch und Englisch.
function toggleLang()
{
    lang = (lang === "de") ? "en" : "de";
    try { localStorage.setItem("lang", lang); } catch(e) {}
    applyLanguage();
}

// Setzt das Design (hell/dunkel) und passt Symbol und Statusleistenfarbe an.
function applyTheme()
{
    document.documentElement.setAttribute("data-theme", theme);

    let meta = document.querySelector('meta[name="theme-color"]');
    if(meta)
    {
        meta.setAttribute("content", (theme === "light") ? "#ffffff" : "#0a0b0d");
    }

    // Sonne im dunklen Modus (tippen -> hell), Mond im hellen Modus.
    document.getElementById("themeBtn").innerHTML = (theme === "light") ? "&#9790;" : "&#9728;";
}

// Wechselt zwischen hellem und dunklem Design.
function toggleTheme()
{
    theme = (theme === "dark") ? "light" : "dark";
    try { localStorage.setItem("theme", theme); } catch(e) {}
    applyTheme();
}

// Liest gespeicherte Sprache/Design und wendet beides an.
function initPrefs()
{
    try
    {
        let savedTheme = localStorage.getItem("theme");
        if(savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
        let savedLang = localStorage.getItem("lang");
        if(savedLang === "de" || savedLang === "en") lang = savedLang;
    }
    catch(e) {}

    applyTheme();
    applyLanguage();
}

function connect()
{
    if(socket &&
       (socket.readyState === WebSocket.OPEN ||
        socket.readyState === WebSocket.CONNECTING))
    {
        return;
    }

    socket = new WebSocket(
        "ws://" + window.location.hostname + "/ws"
    );

    socket.onopen = function()
    {
        setConnected(true);
    };

    socket.onclose = function()
    {
        setConnected(false);
        reconnectTimer = setTimeout(connect, 2000);
    };

    socket.onerror = function()
    {
        setConnected(false);
    };

    socket.onmessage = function(event)
    {
        try
        {
            updateUI(JSON.parse(event.data));
        }
        catch(error)
        {
            console.log(error);
        }
    };
}

function setConnected(ok)
{
    document
        .getElementById("connDot")
        .classList.toggle("on", ok);
}

function send(data)
{
    if(!socket || socket.readyState !== WebSocket.OPEN)
    {
        return;
    }

    socket.send(JSON.stringify(data));
}

function sendMode(mode)
{
    send({ mode: mode });
}

function setBrightness(type, value)
{
    value = parseInt(value);

    document.getElementById(type + "Value").innerText = value;

    const data = {};
    data[type] = value;

    send(data);
}

function updateUI(data)
{
    lastData = data;

    const buttons = document.querySelectorAll(".mode");
    for(let i = 0; i < buttons.length; i++)
    {
        const button = buttons[i];
        const buttonMode = parseInt(button.dataset.mode);
        if(buttonMode === data.mode)
        {
            button.classList.add("active");
        }
        else
        {
            button.classList.remove("active");
        }
    }

    if(data.mode !== undefined)
    {
        document.getElementById("modeBadge").innerText = MODE_LABEL[lang][data.mode] || "–";
    }
    document.getElementById("clock").innerText = data.time || "--:--:--";

    updateSlider("left",   data.left);
    updateSlider("right",  data.right);
    updateSlider("logo",   data.logo);
    updateSlider("global", data.global);

    // Im Automatik-Modus (3) steuert die Uhrzeit die Helligkeit - die Regler
    // sind dann gesperrt.
    setSlidersDisabled(data.mode === 3);

    let sys = "";
    sys += kv(t("sys.firmware"), data.firmware || "-");
    sys += kv(t("sys.time"),     data.time || "--:--:--");
    sys += kv(t("sys.date"),     data.date || "--.--.----");

    if(data.rtc)
    {
        sys += kv(t("sys.rtc"), t("val.ok"), "ok");
    }
    else
    {
        sys += kv(t("sys.rtc"), t("val.rtcMissing"), "warn");
    }

    if(data.ntp)
    {
        sys += kv(t("sys.ntp"), t("val.ntpSynced"), "ok");
    }
    else
    {
        sys += kv(t("sys.ntp"), t("val.ntpNot"), "warn");
    }

    if(data.wifi)
    {
        sys += kv(t("sys.wifi"), t("val.connected"), "ok");
    }
    else if(data.ap)
    {
        sys += kv(t("sys.wifi"), t("val.setupAp"), "warn");
    }
    else
    {
        sys += kv(t("sys.wifi"), t("val.disconnected"), "warn");
    }

    sys += kv(t("sys.ip"), data.ip || "-");

    if(data.wifi && data.rssi !== undefined)
    {
        sys += kv(t("sys.signal"), data.rssi + " dBm");
    }

    document.getElementById("systemStatus").innerHTML = sys;

    if(data.sched)
    {
        // Das komplette Automatik-Profil (Uhrzeiten und Helligkeiten) ist fest
        // im Code (config.h) und wird nur angezeigt, nicht editiert.
        schedule = data.sched;
        renderAutoPhases();
    }

    let autoValue = "-";
    if(data.autoBrightness !== undefined)
    {
        autoValue = data.autoBrightness;
    }
    document.getElementById("autoStatus").innerHTML =
        t("autoNow") + " <b>" + autoValue + " %</b>";

    if(data.presets)
    {
        renderPresets(data.presets);
    }
}

function kv(label, value, cls)
{
    let classAttr = "";
    if(cls)
    {
        classAttr = " class='" + cls + "'";
    }
    return "<div class='kv'><span>" + label + "</span><b" + classAttr + ">" + value + "</b></div>";
}

// Sperrt oder entsperrt alle Helligkeits-Regler (Segmente und Effekt).
function setSlidersDisabled(disabled)
{
    const ids = ["leftSlider", "rightSlider", "logoSlider", "globalSlider"];
    for(let i = 0; i < ids.length; i++)
    {
        const slider = document.getElementById(ids[i]);
        if(!slider)
        {
            continue;
        }
        slider.disabled = disabled;
        slider.parentNode.classList.toggle("off", disabled);
    }
}

function updateSlider(type, value)
{
    if(value === undefined)
    {
        return;
    }

    const slider = document.getElementById(type + "Slider");
    const output = document.getElementById(type + "Value");

    if(slider)
    {
        slider.value = value;
    }
    if(output)
    {
        output.innerText = value;
    }
}

function renderPresets(list)
{
    const box = document.getElementById("presetList");

    if(!list || list.length === 0)
    {
        box.innerHTML =
            "<p class='hint' style='margin:0'>" + t("scene.empty") + "</p>";
        return;
    }

    let html = "";

    for(let i = 0; i < list.length; i++)
    {
        const p = list[i];
        html +=
            "<div class='preset'>" +
                "<button class='apply' onclick='applyPreset(" + p.slot + ")'>" +
                    escapeHtml(p.name) + " &middot; " +
                    p.left + " / " + p.right + " / " + p.logo +
                "</button>" +
                "<button class='delete' onclick='deletePreset(" + p.slot + ")'>" + t("scene.delete") + "</button>" +
            "</div>";
    }

    box.innerHTML = html;
}

function escapeHtml(value)
{
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function savePreset()
{
    const field = document.getElementById("presetName");
    const name = field.value.trim();

    if(name.length === 0)
    {
        alert(t("scene.enterName"));
        return;
    }

    send({ savePreset: name });
    field.value = "";
}

// Komplettes Automatik-Profil (Uhrzeiten + Helligkeiten). Steht fest in
// config.h und kommt nur ueber den Status - in der App reine Anzeige.
let schedule = {
    tMorning: 6, tDay: 8, tEvening: 18, tNight: 23,
    bMorning: 90, bDay: 90, bEveStart: 60, bEveEnd: 25
};

function two(n)
{
    return String(n).padStart(2, "0");
}

// Baut die schreibgeschuetzte Phasen-Uebersicht: Name, Zeitfenster, Helligkeit.
function renderAutoPhases()
{
    const s = schedule;
    const rows = [
        [t("phase.morning"), s.tMorning, s.tDay,     "&rarr; " + s.bMorning + " %"],
        [t("phase.day"),     s.tDay,     s.tEvening, s.bDay + " %"],
        [t("phase.evening"), s.tEvening, s.tNight,   s.bEveStart + " &rarr; " + s.bEveEnd + " %"],
        [t("phase.night"),   s.tNight,   s.tMorning, t("phase.off")]
    ];

    let html = "";
    for(let i = 0; i < rows.length; i++)
    {
        const r = rows[i];
        html +=
            "<div class='phase'>" +
                "<span class='ph-name'>" + r[0] + "</span>" +
                "<span class='ph-time'>" + two(r[1]) + ":00–" + two(r[2]) + ":00</span>" +
                "<span class='ph-val'>" + r[3] + "</span>" +
            "</div>";
    }

    document.getElementById("autoPhases").innerHTML = html;
}

function applyPreset(slot)
{
    send({ applyPreset: slot });
}

function deletePreset(slot)
{
    if(!confirm(t("scene.confirmDelete")))
    {
        return;
    }

    send({ deletePreset: slot });
}

const sliderTypes = ["left", "right", "logo", "global"];
for(let i = 0; i < sliderTypes.length; i++)
{
    const type = sliderTypes[i];
    const slider = document.getElementById(type + "Slider");
    slider.addEventListener("input", function()
    {
        setBrightness(type, this.value);
    });
}

// --- PWA-Installation ------------------------------------------------------
// Die App laesst sich auf Handy/Tablet/Desktop als eigenstaendige App ablegen.
// Android/Desktop-Browser liefern dafuer das Event "beforeinstallprompt", das
// wir aufheben und hinter dem Installieren-Button ausloesen. iOS/Safari kennt
// das Event nicht und braucht stattdessen einen manuellen Hinweis.

let deferredInstallPrompt = null;

function isStandalone()
{
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
}

function isIOS()
{
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

// Setzt den Hinweistext der Installieren-Karte (je nach Sprache und Geraet).
function updateInstallHint()
{
    const hint = document.getElementById("installHint");
    if(!hint)
    {
        return;
    }
    hint.innerHTML = installIsIOS ? t("install.hintIOS") : t("install.hintDefault");
}

function showInstallCard(iosMode)
{
    if(isStandalone())
    {
        return;
    }
    const card = document.getElementById("installCard");
    if(!card)
    {
        return;
    }
    card.style.display = "";
    installIsIOS = iosMode;

    if(iosMode)
    {
        document.getElementById("installBtn").style.display = "none";
    }
    updateInstallHint();
}

function installApp()
{
    if(!deferredInstallPrompt)
    {
        return;
    }
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function()
    {
        deferredInstallPrompt = null;
    });
}

window.addEventListener("beforeinstallprompt", function(event)
{
    event.preventDefault();
    deferredInstallPrompt = event;
    showInstallCard(false);
});

window.addEventListener("appinstalled", function()
{
    deferredInstallPrompt = null;
    const card = document.getElementById("installCard");
    if(card)
    {
        card.style.display = "none";
    }
});

window.addEventListener("load", function()
{
    if(!isStandalone() && isIOS())
    {
        showInstallCard(true);
    }
});

window.addEventListener("load", initPrefs);
window.addEventListener("load", connect);

</script>
